# Weekly scheduled execution: every Monday at 10:30 AM (Cron: 30 10 * * 1)
variables:
  WEEKLY_HOURS: 
    value: "--hours=168"
    description: "Number of hours to analyze for the past week (7 days * 24h = 168h)."
  CONFLUENCE_TRACKING_ARG:
    value: "--confluence-tracking=false"
    description: "Enable Confluence tracking and synchronization for the review meeting (disabled by default)."
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - generate_alerting_report

generate_alerting_report: 
  stage: generate_alerting_report 
  cache:
    key: pip-dependencies
    paths:
      - .cache/pip
  script: 
    - |
      set -e
      python3 -m venv venv
      ./venv/bin/python3 -m pip install --upgrade pip
      ./venv/bin/pip install -r requirements.txt
      ./venv/bin/python3 main.py $WEEKLY_HOURS $CONFLUENCE_TRACKING_ARG
      
  artifacts:
    paths:
      - output/
    expire_in: 1 week
  retry: 2

  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_COMMIT_REF_NAME == "dev"'
      when: manual
